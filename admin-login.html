<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin Login | Obsidian Arc Lab</title><link rel="stylesheet" href="admin.css"></head><body class="login-page"><main class="login-card"><a class="back" href="index.html">← Back to catalogue</a><p class="eyebrow">OBSIDIAN ARC LAB</p><h1>Business Admin</h1><p class="muted">Sign in to manage orders, expenses and products.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><p id="error" class="error" aria-live="polite"></p><button type="submit">SIGN IN</button></form><small class="warning">Temporary private access for the business owner.</small></main><script>if(sessionStorage.getItem('oa_admin')==='yes')location.replace('admin.html');document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase();const password=document.getElementById('password').value;if(email==='obsidianarclab@gmail.com'&&password==='tiviviji'){sessionStorage.setItem('oa_admin','yes');location.replace('admin.html')}else{document.getElementById('error').textContent='Incorrect email or password.'}});</script></body></html>
